(()=>{const Q=id=>document.getElementById(id),D=JSON.parse(Q('data').textContent),R=Q('questions'),F=Q('filters'),read=()=>{try{let value=JSON.parse(localStorage.getItem('mark-quiz-v1')||'{}');return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}catch{return{}}},S=read(),search=Q('search'),empty=Q('empty'),bar=Q('bar'),stat=Q('stat'),mstat=Q('mstat'),toggle=Q('toggle'),revealAll=Q('revealAll'),grade=Q('grade'),score=Q('score'),scoreNote=Q('scoreNote'),result=Q('result'),closeBtn=Q('close'),reset=Q('reset');let current='전체',show=false;function save(){try{localStorage.setItem('mark-quiz-v1',JSON.stringify(S))}catch{}}const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){R.innerHTML='';let last='',count=0,term=search.value.trim().toLowerCase();D.forEach(q=>{let hay=[q.prompt,...q.choices.map(x=>x.text),q.evidence,q.trap].join(' ').toLowerCase();if((current!=='전체'&&q.section!==current)||(term&&!hay.includes(term)))return;if(q.section!==last){let h=document.createElement('h3');h.className='section-title';h.textContent=q.section;R.appendChild(h);last=q.section}let p=q.evidence.match(/\[PDF 페이지\s*[^\]]+\]/),a=document.createElement('article'),picked=S[q.number]||'';a.className='question'+(show?' revealed':'');a.id='q'+q.number;a.dataset.answer=q.answer;a.innerHTML=`<div class="q-head"><span class="q-no">${String(q.number).padStart(2,'0')}</span><div style="min-width:0;flex:1"><div class="q-text">${E(q.prompt)}</div><div class="choices">${q.choices.map(c=>`<label class="choice"><input type="radio" name="q${q.number}" value="${c.mark}" ${picked===c.mark?'checked':''}><span><b>${c.mark}</b> ${E(c.text)}</span></label>`).join('')}</div><div class="explanation"><div class="answer-line">정답 ${q.answer}</div><p class="evidence"><b>근거</b> ${E(q.evidence.replace(/\s*\[PDF 페이지[^\]]+\]/,''))}</p>${p?`<span class="source">${E(p[0])}</span>`:''}<p class="trap"><b>함정</b> ${E(q.trap)}</p></div></div></div>`;R.appendChild(a);count++});empty.style.display=count?'none':'block';document.querySelectorAll('.question input').forEach(x=>x.onchange=e=>{S[e.target.name.slice(1)]=e.target.value;save();update()});update()}function update(){let n=Object.keys(S).filter(k=>S[k]).length,p=Math.round(n/D.length*100);bar.style.width=p+'%';stat.textContent=`${n} / ${D.length} 응답`;mstat.textContent=stat.textContent}['전체',...new Set(D.map(q=>q.section))].forEach(n=>{let b=document.createElement('button');b.className='filter'+(n==='전체'?' active':'');b.textContent=n==='전체'?'전체 84문항':n;b.onclick=()=>{current=n;document.querySelectorAll('#filters .filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};F.appendChild(b)});search.oninput=render;toggle.onclick=()=>{show=!show;toggle.textContent=show?'해설 숨기기':'해설 보기';render()};revealAll.onclick=()=>{show=true;render()};grade.onclick=()=>{let answered=D.filter(q=>S[q.number]),n=answered.length,c=answered.filter(q=>S[q.number]===q.answer).length;document.querySelectorAll('.question').forEach(a=>{let picked=S[a.id.slice(1)];a.classList.add('revealed');a.classList.remove('correct','wrong');a.querySelectorAll('.choice').forEach(l=>{let v=l.querySelector('input').value;l.classList.toggle('answer',v===a.dataset.answer);l.classList.toggle('selected-wrong',v===picked&&picked!==a.dataset.answer)});if(picked){a.classList.add(picked===a.dataset.answer?'correct':'wrong')}});score.textContent=`${c} / ${D.length}`;scoreNote.textContent=`응답 ${n}문항 · 응답 기준 정답률 ${n?Math.round(c/n*100):0}%`;result.classList.add('show')};closeBtn.onclick=()=>result.classList.remove('show');reset.onclick=()=>{if(confirm('저장된 답안을 모두 지울까요?')){Object.keys(S).forEach(k=>delete S[k]);try{localStorage.removeItem('mark-quiz-v1')}catch{}show=false;toggle.textContent='해설 보기';result.classList.remove('show');render()}};render()})();
</script></body></html>
